<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#e9ecef" />
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#bc6c25" />
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3b18a" />
      <stop offset="100%" stop-color="#588157" />
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="340" fill="url(#wall)" />

  <!-- Floor -->
  <rect y="340" width="800" height="160" fill="url(#floor)" />

  <!-- Perspective Floor Lines -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#9a7b56" stroke-width="1.5" />
  <line x1="200" y1="340" x2="100" y2="500" stroke="#9a7b56" stroke-width="1.5" />
  <line x1="400" y1="340" x2="400" y2="500" stroke="#9a7b56" stroke-width="1.5" />
  <line x1="600" y1="340" x2="700" y2="500" stroke="#9a7b56" stroke-width="1.5" />

  <!-- Background Bookshelves -->
  <!-- Shelf Left -->
  <rect x="40" y="40" width="220" height="280" fill="#343a40" rx="4" />
  <!-- Shelf Rows -->
  <rect x="50" y="90" width="200" height="10" fill="#6c757d" />
  <rect x="50" y="150" width="200" height="10" fill="#6c757d" />
  <rect x="50" y="210" width="200" height="10" fill="#6c757d" />
  <rect x="50" y="270" width="200" height="10" fill="#6c757d" />

  <!-- Books Left Shelf -->
  <!-- Row 1 Books -->
  <rect x="60" y="55" width="15" height="35" fill="#0d6efd" />
  <rect x="77" y="50" width="18" height="40" fill="#dc3545" />
  <rect x="97" y="58" width="14" height="32" fill="#ffc107" />
  <rect x="113" y="52" width="20" height="38" fill="#198754" />
  <rect x="135" y="55" width="16" height="35" fill="#0dcaf0" />
  <rect x="153" y="50" width="22" height="40" fill="#6f42c1" />
  <rect x="177" y="58" width="18" height="32" fill="#fd7e14" />

  <!-- Row 2 Books -->
  <rect x="60" y="115" width="18" height="35" fill="#198754" />
  <rect x="80" y="110" width="22" height="40" fill="#0d6efd" />
  <rect x="104" y="118" width="16" height="32" fill="#dc3545" />
  <rect x="122" y="112" width="25" height="38" fill="#ffc107" />
  <rect x="149" y="115" width="18" height="35" fill="#6610f2" />

  <!-- Shelf Right -->
  <rect x="540" y="40" width="220" height="280" fill="#343a40" rx="4" />
  <rect x="550" y="90" width="200" height="10" fill="#6c757d" />
  <rect x="550" y="150" width="200" height="10" fill="#6c757d" />
  <rect x="550" y="210" width="200" height="10" fill="#6c757d" />
  <rect x="550" y="270" width="200" height="10" fill="#6c757d" />

  <!-- Books Right Shelf -->
  <rect x="560" y="50" width="20" height="40" fill="#0284c7" />
  <rect x="582" y="55" width="16" height="35" fill="#16a34a" />
  <rect x="600" y="52" width="24" height="38" fill="#ea580c" />
  <rect x="626" y="58" width="18" height="32" fill="#9333ea" />
  <rect x="646" y="50" width="22" height="40" fill="#e11d48" />

  <!-- Banner / UTL Poster in Center -->
  <rect x="300" y="50" width="200" height="110" fill="#00875a" rx="6" stroke="#ffffff" stroke-width="3" />
  <text x="400" y="90" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16" text-anchor="middle">SALA DE LECTURA</text>
  <text x="400" y="115" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" text-anchor="middle">Zona de Silencio y Estudio</text>
  <text x="400" y="140" fill="#ffe600" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">UTL LEÓN</text>

  <!-- Large Study Table in Foreground -->
  <!-- Table Top -->
  <polygon points="200,310 600,310 650,390 150,390" fill="#4a5759" stroke="#2b2d42" stroke-width="2" />
  <!-- Table Legs -->
  <rect x="170" y="390" width="20" height="80" fill="#2b2d42" />
  <rect x="610" y="390" width="20" height="80" fill="#2b2d42" />

  <!-- Laptops & Open Books on Table -->
  <!-- Laptop 1 -->
  <rect x="250" y="325" width="60" height="40" rx="3" fill="#adb5bd" stroke="#495057" stroke-width="1.5" />
  <polygon points="240,365 320,365 310,380 250,380" fill="#6c757d" />

  <!-- Open Book -->
  <path d="M 390 340 Q 420 335 450 340 L 450 370 Q 420 365 390 370 Z" fill="#ffffff" stroke="#ced4da" />
  <path d="M 450 340 Q 480 335 510 340 L 510 370 Q 480 365 450 370 Z" fill="#ffffff" stroke="#ced4da" />
  <line x1="450" y1="340" x2="450" y2="370" stroke="#0d6efd" stroke-width="2" />

  <!-- Desk Lamp -->
  <path d="M 550 365 L 565 330 L 550 320" fill="none" stroke="#ffc107" stroke-width="4" stroke-linecap="round" />
  <polygon points="540,325 560,315 555,325" fill="#ffc107" />

  <!-- Title Overlay at bottom -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(0,0,0,0.6)" />
  <text x="30" y="475" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20">2. Sala de Lectura y Estudio - Biblioteca UTL</text>
</svg>
